<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeric Input Example</title>
    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Prevent form submission
            const rateInput = document.getElementById('oRate');
            const rateValue = parseFloat(rateInput.value);
            
            if (!isNaN(rateValue) && rateValue >= 0) {
                alert(`Entered rate: ${rateValue}`);
            } else {
                alert('Please enter a valid rate.');
            }
        }
        
        window.onload = function () {
            const form = document.querySelector('form');
            form.addEventListener('submit', handleSubmit);
        };
    </script>
</head>
<body>
    <form>
        <label for="oRate">Rate:</label>
        <input type="number" id="oRate" min="0" step="0.01" placeholder="Enter Total">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
